services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      LIBRETRANSLATE_URL: http://libretranslate:5000
    expose:
      - "3001"
    restart: unless-stopped

  # LibreTranslate NÃO sobe por padrão: em 4 GB de RAM ele levava a VM a
  # thrashing e derrubava o painel. Fica atrás do profile "translate" e com
  # limite de memória — suba sob demanda para traduzir um lote grande:
  #   docker compose --profile translate up -d libretranslate
  # Sem ele, o worker de tradução apenas cai no glossário (a tradução já feita
  # permanece no cache persistente title_translations).
  libretranslate:
    image: libretranslate/libretranslate
    environment:
      LT_LOAD_ONLY: pt,en
    mem_limit: 1600m
    profiles:
      - translate
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
