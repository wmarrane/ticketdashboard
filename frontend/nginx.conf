server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Resolve o host "backend" via DNS interno do Docker a cada requisição
    # (com o hostname numa variável). Sem isto, a nginx fixa o IP do backend
    # no start e um redeploy só do backend (IP novo) causa 502 até reiniciar
    # a nginx.
    resolver 127.0.0.11 valid=10s;
    set $backend "http://backend:3001";
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 25m;
  }

  location / {
    try_files $uri /index.html;
  }
}
